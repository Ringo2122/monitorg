name: Удалить тестовую копию на хостинге (разово)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Удалить _test
        env:
          HOSTER_SSH_KEY: ${{ secrets.HOSTER_SSH_KEY }}
          HOSTER_KNOWN_HOSTS: ${{ secrets.HOSTER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTER_SSH_KEY" > ~/.ssh/hoster && chmod 600 ~/.ssh/hoster
          printf '%s\n' "$HOSTER_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hoster -o BatchMode=yes h220178@vh167.hoster.by '
            d=~/www/monitorg.by/_test
            if [ -d "$d" ]; then echo "было: $(du -sm "$d" | cut -f1) МБ"; rm -rf -- "$d"; fi
            echo "осталось папки _test: $(test -e "$d" && echo да || echo нет)"
            echo "всего занято: $(du -sm ~ | cut -f1) МБ"
            echo "сайт на месте: $(test -f ~/www/monitorg.by/index.html && echo да || echo НЕТ)"'
          rm -f ~/.ssh/hoster
