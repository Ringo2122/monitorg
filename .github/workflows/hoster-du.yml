name: Место на хостинге (разовая проверка)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  du:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Размеры папок
        env:
          HOSTER_SSH_KEY: ${{ secrets.HOSTER_SSH_KEY }}
          HOSTER_KNOWN_HOSTS: ${{ secrets.HOSTER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTER_SSH_KEY" > ~/.ssh/hoster && chmod 600 ~/.ssh/hoster
          printf '%s\n' "$HOSTER_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hoster -o BatchMode=yes h220178@vh167.hoster.by '
            echo "== всего"; du -sm ~ 2>/dev/null
            echo "== верхний уровень"; du -sm ~/* ~/.[!.]* 2>/dev/null | sort -n | tail -20
            echo "== www"; du -sm ~/www/* 2>/dev/null | sort -n | tail -15
            echo "== monitorg.by"; du -sm ~/www/monitorg.by/* ~/www/monitorg.by/.[!.]* 2>/dev/null | sort -n | tail -15
            echo "== файлы в корне сайта без папок"; find ~/www/monitorg.by -maxdepth 1 -type f -size +5M -exec du -sm {} \; 2>/dev/null | sort -n | tail -10
            echo "== _test"; du -sm ~/www/monitorg.by/_test 2>/dev/null'
          rm -f ~/.ssh/hoster
